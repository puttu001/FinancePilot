app_name: "FinancePilot"

logging:
  log_dir: 'logs'
  log_file: 'app.log'
  level: 'DEBUG'
  max_bytes: 1048576 # 1MB
  backup_count: 3

chunking:
  size: 1200
  overlap: 200

embeddings:
  DENSE_MODEL: "text-embedding-3-large"
  SPARSE_MODEL: "Qdrant/bm25"
  VECTOR_NAME: "text-dense"
  SPARSE_VECTOR_NAME: "text-sparse"
  DENSE_VECTOR_SIZE: 3072

retrieval:
  default_k: 5
  multi_query_k: 5

reranker:
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_n: 5
  score_threshold: -5.0

generation:
  model: "gpt-4o-mini"
  temperature: 0
  max_tokens: 2048

vector_db:
  collection_name: "FinancePilot"
  qdrant_url: ${QDRANT_URL}
  qdrant_api_key: ${QDRANT_API_KEY}

langsmith:
  project_name: FinancePilot
  tracing_enabled: true


